background {
    monitor =
    path = ~/.config/wallpapers/lockscreen
    blur_passes = 1
    blur_size = 6
    brightness = 0.7
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 160
    font_family = sans-serif
    color = rgba(255, 250, 240, 0.95)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 250
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LANG=ja_JP.UTF-8 date +"%A, %Y年%m月%d日"
    font_size = 40
    font_family = IPAPGothic
    color = rgba(255, 250, 240, 0.95)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 120
    halign = center
    valign = center
}

# Motto
label {
    monitor =
    text = The absence of a particular solution is never the problem.
    font_size = 24
    font_family = sans-serif
    color = rgba(180, 220, 140, 0.9)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = The problem is the problem.
    font_size = 24
    font_family = sans-serif
    color = rgba(180, 220, 140, 0.9)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, -50
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 350, 60
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(100, 160, 80, 0.6)
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgba(255, 250, 240, 0.9)
    fade_on_empty = true
    fail_on_empty = false
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    rounding = 16
    check_color = rgba(180, 220, 140, 0.8)
    fail_color = rgba(200, 80, 80, 0.8)
    fail_text = <i>Authentication failed</i>
    fail_transition = 300
    position = 0, -180
    halign = center
    valign = center
}
