# Checks to see if we're in vim or fzf.
# This form avoids `ps -t`, which the work laptop's mandatory security
# software interferes with.
# TODO: try unifying both platforms on this `-o tty=` form -- upstream
# vim-tmux-navigator ships it for Linux too.
is_vim="ps -o tty= -o state= -o comm= | grep -iqE '^#{s|/dev/||:pane_tty} +[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o tty= -o state= -o comm= | grep -iqE '^#{s|/dev/||:pane_tty} +[^TXZ ]+ +(\\S+\\/)?fzf$'"
