# Checks to see if we're in vim or fzf.
# This form avoids `ps -t`, which the work laptop's mandatory security
# software interferes with.
# Set as user options (not shell vars): a variable assigned in a sourced
# file is invisible to $var expansion in the sourcing file, since tmux.conf
# is fully expanded before source-file runs. tmux.conf reads these back
# with #{E:@is_vim}, which expands the value's own #{pane_tty}.
# TODO: try unifying both platforms on this `-o tty=` form -- upstream
# vim-tmux-navigator ships it for Linux too.
set -g @is_vim "ps -o tty= -o state= -o comm= | grep -iqE '^#{s|/dev/||:pane_tty} +[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
set -g @is_fzf "ps -o tty= -o state= -o comm= | grep -iqE '^#{s|/dev/||:pane_tty} +[^TXZ ]+ +(\\S+\\/)?fzf$'"
