# Checks to see if we're in vim or fzf.
# Set as user options (not shell vars): a variable assigned in a sourced
# file is invisible to $var expansion in the sourcing file, since tmux.conf
# is fully expanded before source-file runs. tmux.conf reads these back
# with #{E:@is_vim}, which expands the value's own #{pane_tty}.
# TODO: try unifying on the `-o tty=` form macos/ uses -- upstream
# vim-tmux-navigator ships that variant for both platforms.
set -g @is_vim "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
set -g @is_fzf "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"
