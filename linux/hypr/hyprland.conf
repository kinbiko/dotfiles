# Setup monitors
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1, 3840x2160@60, 0x0, 1
monitor=DP-1, 3440x1440@60, 3840x0, 1

# Dual monitor example on G15 Strix
# eDP-1 is the built in monitor while DP-1 is external
# Both monitors here are at 1440 and 165Hz
# DP-1 is on the left and  eDP-1 is on the right
#monitor=DP-1,2560x1440@165,0x0,1
#monitor=eDP-1,2560x1440@165,2560x0,1.25

# Workspace-to-monitor binding (when docked)
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:DP-1, default:true
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# Dark theme for Qt apps (Transmission etc.) — needs adwaita-qt5/adwaita-qt6
env = QT_STYLE_OVERRIDE,Adwaita-Dark

# Execute your favorite apps at launch
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = while true; do waybar; sleep 1; done
exec-once = mako
exec-once = blueman-applet
exec-once = nm-applet --indicator
exec-once = awww-daemon && awww img ~/.config/wallpapers/arch-01.png --transition-type none
exec-once = fcitx5
# Launcher. Runs as a daemon so the SPACE bind below only has to raise it;
# a cold start would otherwise cost a second on every invocation.
exec-once = wox
# The Acer is shared with another computer via its own input switch. Hyprland
# can't tell the difference, so this watches DDC/CI and disables/enables it.
exec-once = ~/.config/hypr/acer-input-watch.sh >> /tmp/acer-input-watch.log 2>&1
# kanshi removed: it raced with Hyprland's native monitor= rules on hotplug,
# leaving both outputs stacked at 0x0 (cursor on both screens + slowness) when
# the LG's input was switched away and back. Hyprland reapplies the monitor=
# rules above on reconnect natively, so kanshi is redundant here.

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options=ctrl:nocaps
    kb_rules =

    follow_mouse = 0

    touchpad {
        natural_scroll = no
        scroll_factor = 0.3 # -1.0 - 1.0, 0 means no modification.
        tap-to-click = false # -1.0 - 1.0, 0 means no modification.
        clickfinger_behavior = true # Button presses with 1, 2, or 3 fingers will be mapped to LMB, RMB, and MMB respectively.
    }

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 18
    gaps_out = 13, 13, 13, 13
    border_size = 1
    col.active_border=rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = yes
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 4
    
    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier, slide
    animation = windowsOut, 1, 4, myBezier, slide
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 0, 0.5, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = yes # removed in Hyprland 0.55+; pseudotile is now per-window only via the `pseudo` dispatcher / windowrule
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}

gesture = 4, horizontal, workspace

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe_min_speed_to_force = 10
    workspace_swipe_invert = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device:epic mouse V1 {
    #sensitivity = -0.5
}

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# rules below would make the specific app transparent
#windowrule = opacity 0.8 0.8,class:^(alacritty)$
#windowrule = animation popin,class:^(alacritty)$
#windowrule = float,title:^(pavucontrol)$
#windowrule = float,title:^(blueman-manager)$
#windowrule = float,title:^(nm-connection-editor)$
#windowrule = float,title:^(update-sys)$

windowrule = opacity 0.8 0.8, animation popin, match:class ^(alacritty)$
windowrule = float on, match:title ^(pavucontrol)$
windowrule = float on, match:title ^(blueman-manager)$
windowrule = float on, match:title ^(nm-connection-editor)$
windowrule = float on, match:title ^(update-sys)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, killactive, # close the active window
bind = $mainMod, V, togglefloating, # Allow a window to float
bind = $mainMod, RETURN, exec, alacritty
# Launcher. Wox registers its own global hotkeys through `hyprctl eval`, which
# only works under Hyprland's Lua config manager; this config is the
# traditional kind, so that path always fails. Wox's own hotkeys are therefore
# left blank in its settings and bound here instead. Passing a deeplink rather
# than running `wox` bare means the new process hands off to the running
# instance over loopback and exits, so a second press toggles rather than
# cold-starting a duplicate.
bind = $mainMod, SPACE, exec, wox wox://toggle # Show the graphical app launcher
bind = $mainMod SHIFT, SPACE, exec, wox wox://select # Query the current selection
bind = $mainMod, W, exec, librewolf
bind = $mainMod, E, exec, nemo
bind = $mainMod, S, exec, grim -t jpeg -q 100 -g "$(slurp)" - | swappy -f - # take a screenshot
bind = $mainMod, P, exec, hyprpicker
bind = $mainMod, F, fullscreen

# Lock screen (random solarpunk wallpaper)
bind = $mainMod, X, exec, ln -sf $(shuf -n1 -e ~/.config/wallpapers/solarpunk-*) ~/.config/wallpapers/lockscreen && hyprlock

# Audio controls
bind = , F10, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , F11, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , F12, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%

# Volume knob (media keys): el = works while locked + key repeat, l = works while locked
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

bindit = $mainMod, SUPER_L, exec, pkill -SIGUSR2 waybar
bindirt = $mainMod, SUPER_L, exec, pkill -SIGUSR1 waybar
bind = $mainMod, B, exec, pkill -SIGUSR2 waybar

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9] (set wallpaper before switch)
$wp = ~/.config/wallpapers
bind = $mainMod, 1, exec, awww img $wp/arch-01.png --transition-type none -o HDMI-A-1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, exec, awww img $wp/balamb-garden.png --transition-type none -o HDMI-A-1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, exec, awww img $wp/dream-office.png --transition-type none -o DP-1
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, exec, awww img $wp/solarpunk-01.jpg --transition-type none -o DP-1
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, exec, awww img $wp/solarpunk-02.jpg --transition-type none -o DP-1
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, exec, awww img $wp/solarpunk-03.png --transition-type none -o HDMI-A-1
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, exec, awww img $wp/solarpunk-04.png --transition-type none -o HDMI-A-1
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, exec, awww img $wp/solarpunk-05.png --transition-type none -o HDMI-A-1
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, exec, awww img $wp/solarpunk-06.png --transition-type none -o HDMI-A-1
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, exec, awww img $wp/solarpunk-07.png --transition-type none -o HDMI-A-1
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizeactive

bind = $mainMod, Z, exec, ~/repos/yomihan/target/release/yomihan trigger
windowrule {
  name = yomihan
  match:class = ^(yomihan)$
  float = on
  pin = on
}

exec = gsettings set org.gnome.desktop.interface gtk-theme "Orchis-Dark-Compact"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
